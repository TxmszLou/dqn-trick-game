[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dqn-trick-game"
version = "0.1.0"
description = "Deep reinforcement learning experiments for a simplified Spades trick-taking environment."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "ipykernel>=6.29.0",
    "ipython>=8.0.0",
    "jupyter>=1.1.0",
    "matplotlib>=3.8.0",
    "pytest>=8.0.0",
    "torch>=2.2.0",
    "tqdm>=4.66.0",
]

[project.scripts]
trick-game-evaluate = "trick_game.evaluate:main"
trick-game-train-dqn = "trick_game.train_dqn:main"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["trick_game"]

[tool.pytest.ini_options]
testpaths = ["tests"]
